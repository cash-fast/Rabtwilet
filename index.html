<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>كاش فاستر | منصة التمويل الآمنة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== RESET & ROOT ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1A8C4A;
      --primary-dark: #0F6B38;
      --gold: #C9A84C;
      --gold-dark: #A8892E;
      --gold-glow: rgba(201,168,76,0.25);
      --bg-dark: #0D1117;
      --bg-card: #161B22;
      --text-light: #F0F6FC;
      --text-muted: #8B949E;
      --border-color: #30363D;
      --shadow: 0 8px 32px rgba(0,0,0,0.7);
      --danger: #DA3633;
      --orange: #D29922;
      --anuta-blue: #58A6FF;
      --anuta-purple: #8957E5;
      --font: 'Cairo', sans-serif;
      --success: #2EA043;
      --box-radius: 1.6rem;
      --bg-card-hover: #1C2333;
    }
    body {
      font-family: var(--font);
      background: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.8rem;
      position: relative;
      overflow-x: hidden;
    }
    .bg-particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(26,140,74,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(201,168,76,0.05) 0%, transparent 40%),
        radial-gradient(circle at 40% 80%, rgba(88,166,255,0.03) 0%, transparent 40%);
      pointer-events: none;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }
    @keyframes bgPulse { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 1; transform: scale(1.02); } }

    .bg-grid {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      animation: gridMove 30s linear infinite;
    }
    @keyframes gridMove { 0% { transform: translate(0,0); } 100% { transform: translate(50px,50px); } }

    .floating-shapes {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .floating-shapes .shape {
      position: absolute; border-radius: 50%; opacity: 0.03; animation: floatShape 20s ease-in-out infinite;
    }
    .floating-shapes .shape:nth-child(1) { width: 300px; height: 300px; background: var(--gold); top: -100px; right: -60px; animation-delay: 0s; }
    .floating-shapes .shape:nth-child(2) { width: 200px; height: 200px; background: var(--primary); bottom: -60px; left: -60px; animation-delay: 7s; }
    .floating-shapes .shape:nth-child(3) { width: 150px; height: 150px; background: var(--anuta-blue); top: 30%; right: -30px; animation-delay: 14s; }
    @keyframes floatShape {
      0%, 100% { transform: translate(0,0) scale(1); }
      25% { transform: translate(30px,-30px) scale(1.08); }
      50% { transform: translate(-20px,20px) scale(0.92); }
      75% { transform: translate(20px,30px) scale(1.04); }
    }

    .app-container {
      max-width: 480px;
      width: 100%;
      background: rgba(13, 17, 23, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 2.2rem;
      padding: 1.4rem 1.2rem;
      box-shadow: var(--shadow), 0 0 80px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .app-container::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(26,140,74,0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: glowRotate 30s linear infinite;
    }
    @keyframes glowRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .promo-strip {
      background: linear-gradient(90deg, rgba(201,168,76,0.10), rgba(26,140,74,0.06), rgba(88,166,255,0.04));
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 3rem;
      padding: 0.5rem 1.2rem;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--gold);
      position: relative;
      z-index: 1;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .promo-strip i { color: var(--primary); }
    .promo-strip .highlight { color: var(--gold); font-weight: 700; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
      position: relative; z-index: 1;
    }
    .header .brand { display: flex; align-items: center; gap: 0.6rem; }
    .header .brand .icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--gold), var(--primary));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #0D1117; font-weight: 900;
      box-shadow: 0 0 30px var(--gold-glow);
      animation: iconGlow 3.5s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .header .brand .icon:hover { transform: scale(1.05); }
    @keyframes iconGlow {
      0%, 100% { box-shadow: 0 0 20px var(--gold-glow); }
      50% { box-shadow: 0 0 45px rgba(201,168,76,0.4), 0 0 70px rgba(26,140,74,0.12); }
    }
    .header .brand h1 {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #F0F6FC, var(--primary), var(--gold));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }
    .header .brand h1 span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
    .header .badge {
      background: rgba(46,160,67,0.10);
      border: 1px solid rgba(46,160,67,0.15);
      border-radius: 3rem;
      padding: 0.3rem 1rem;
      font-size: 0.6rem;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(4px);
    }
    .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    .nav-tabs {
      display: flex; gap: 0.4rem; margin: 1rem 0 1rem 0;
      background: rgba(255,255,255,0.02); border-radius: 3rem;
      padding: 0.3rem; border: 1px solid var(--border-color);
      position: relative; z-index: 1;
    }
    .nav-tabs .tab {
      flex: 1; text-align: center; padding: 0.5rem 0.2rem;
      border-radius: 3rem; font-size: 0.6rem; font-weight: 600;
      color: var(--text-muted); cursor: default;
      transition: 0.25s; background: transparent;
    }
    .nav-tabs .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #FFFFFF; box-shadow: 0 4px 16px rgba(26,140,74,0.3);
    }
    .nav-tabs .tab i { margin-left: 0.3rem; }

    .search-box {
      display: flex; gap: 0.5rem; margin: 0.8rem 0 1.2rem 0;
      position: relative; z-index: 1;
    }
    .search-box input {
      flex: 1; padding: 0.8rem 1.2rem; border-radius: 3rem;
      border: 2px solid var(--border-color); background: rgba(255,255,255,0.03);
      color: white; font-size: 0.9rem; text-align: center;
      transition: 0.25s; font-family: var(--font);
      backdrop-filter: blur(4px);
    }
    .search-box input:focus {
      outline: none; border-color: var(--gold);
      box-shadow: 0 0 35px var(--gold-glow);
    }
    .search-box input::placeholder { color: var(--text-muted); font-weight: 400; }
    .search-box button {
      padding: 0.8rem 1.6rem; border: none; border-radius: 3rem;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0D1117; font-weight: 800; cursor: pointer;
      transition: 0.25s; font-family: var(--font); font-size: 0.85rem;
      display: flex; align-items: center; gap: 0.4rem;
      box-shadow: 0 4px 20px var(--gold-glow);
      white-space: nowrap;
    }
    .search-box button:hover { transform: scale(1.03); box-shadow: 0 0 40px rgba(201,168,76,0.4); }

    .loan-card {
      background: linear-gradient(145deg, var(--bg-card), #0F151F);
      border-radius: var(--box-radius);
      padding: 1.4rem 1.2rem;
      border: 1px solid var(--border-color);
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
      overflow: hidden;
      backdrop-filter: blur(4px);
      transition: border-color 0.3s;
    }
    .loan-card:hover { border-color: rgba(201,168,76,0.2); }
    .loan-card::after {
      content: ''; position: absolute; top: -30%; right: -20%;
      width: 70%; height: 120%; background: radial-gradient(ellipse, rgba(201,168,76,0.04), transparent 70%);
      pointer-events: none;
    }
    .loan-card .loan-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; text-align: center; }
    .loan-card .loan-amount-main {
      text-align: center; font-size: 2.8rem; font-weight: 900;
      color: #FFF; margin: 0.2rem 0; letter-spacing: 1px; position: relative; z-index: 1;
    }
    .loan-card .loan-amount-main .currency { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; }
    .loan-card .loan-percent {
      text-align: center; font-size: 0.9rem; color: var(--gold);
      font-weight: 700; position: relative; z-index: 1;
    }
    .loan-card .loan-percent i { color: var(--success); margin-left: 0.4rem; }

    .loan-details-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem; margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid var(--border-color); position: relative; z-index: 1;
    }
    .loan-details-grid .detail-item {
      text-align: center; background: rgba(255,255,255,0.02);
      border-radius: 0.8rem; padding: 0.4rem 0.2rem; transition: 0.2s;
    }
    .loan-details-grid .detail-item:hover { background: rgba(255,255,255,0.04); }
    .loan-details-grid .detail-item .label { font-size: 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .loan-details-grid .detail-item .value { font-size: 0.9rem; font-weight: 700; color: #FFF; margin-top: 0.15rem; }
    .loan-details-grid .detail-item .value.gold { color: var(--gold); }
    .loan-details-grid .detail-item .value.green { color: var(--success); }
    .loan-details-grid .detail-item .value.danger { color: var(--danger); }

    .status-bar {
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(255,255,255,0.02); border-radius: var(--box-radius);
      padding: 0.6rem 1rem; border: 1px solid var(--border-color);
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .status-bar .status-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; flex-shrink: 0;
    }
    .status-bar .status-text { flex: 1; }
    .status-bar .status-text .main { font-weight: 700; font-size: 0.9rem; }
    .status-bar .status-text .sub { font-size: 0.6rem; color: var(--text-muted); }
    .status-bar .status-badge {
      border-radius: 3rem; padding: 0.2rem 0.8rem; font-size: 0.55rem;
      font-weight: 600; backdrop-filter: blur(4px);
    }
    .status-bar.danger .status-icon { background: rgba(218,54,51,0.12); color: var(--danger); }
    .status-bar.danger .status-badge { background: rgba(218,54,51,0.10); border: 1px solid rgba(218,54,51,0.2); color: var(--danger); }
    .status-bar.success .status-icon { background: rgba(46,160,67,0.12); color: var(--success); }
    .status-bar.success .status-badge { background: rgba(46,160,67,0.10); border: 1px solid rgba(46,160,67,0.2); color: var(--success); }
    .status-bar.warning .status-icon { background: rgba(201,168,76,0.12); color: var(--gold); }
    .status-bar.warning .status-badge { background: rgba(201,168,76,0.10); border: 1px solid rgba(201,168,76,0.2); color: var(--gold); }

    .client-info {
      background: rgba(255,255,255,0.02); border-radius: var(--box-radius);
      padding: 0.8rem 1rem; border: 1px solid var(--border-color);
      margin: 0.8rem 0; position: relative; z-index: 1;
      backdrop-filter: blur(4px);
    }
    .client-info .row {
      display: flex; justify-content: space-between;
      padding: 0.35rem 0; border-bottom: 1px solid rgba(255,255,255,0.03);
      font-size: 0.8rem;
    }
    .client-info .row:last-child { border-bottom: none; }
    .client-info .row .key { color: var(--text-muted); }
    .client-info .row .value { font-weight: 600; text-align: left; color: #FFF; }
    .client-info .row .value.gold { color: var(--gold); }
    .client-info .row .value.green { color: var(--success); }
    .client-info .row .value.danger { color: var(--danger); }

    .step-message {
      background: rgba(46,160,67,0.04);
      border: 2px solid var(--success);
      border-radius: var(--box-radius);
      padding: 1rem;
      margin: 0.8rem 0;
      text-align: center;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(4px);
    }
    .step-message i { color: var(--success); font-size: 1.8rem; display: block; margin-bottom: 0.3rem; }
    .step-message p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.9; margin: 0; }
    .step-message .sub-text {
      font-size: 0.7rem;
      color: var(--gold);
      margin-top: 0.6rem;
      display: block;
      background: rgba(201,168,76,0.06);
      padding: 0.4rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid rgba(201,168,76,0.1);
    }
    .step-message .sub-text i { display: inline; font-size: 0.8rem; margin-left: 0.3rem; }

    .open-wallet-notice {
      background: linear-gradient(145deg, rgba(201,168,76,0.06), rgba(218,54,51,0.02));
      border: 2px solid var(--gold);
      border-radius: var(--box-radius);
      padding: 1.2rem;
      margin: 0.8rem 0;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 40px rgba(201,168,76,0.04);
    }
    .open-wallet-notice .ow-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }
    .open-wallet-notice .ow-header .ow-icon {
      font-size: 2.5rem;
      color: var(--gold);
      flex-shrink: 0;
    }
    .open-wallet-notice .ow-header h3 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--gold);
      margin: 0;
    }
    .open-wallet-notice .ow-header h3 .highlight-blue {
      color: var(--anuta-blue);
    }
    .open-wallet-notice .ow-body p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 2;
      margin: 0.3rem 0;
    }
    .open-wallet-notice .ow-body .highlight-gold {
      color: var(--gold);
      font-weight: 700;
    }
    .open-wallet-notice .ow-steps {
      background: rgba(0,0,0,0.25);
      border-radius: 1.2rem;
      padding: 0.7rem 1rem;
      margin: 0.6rem 0;
      border-right: 4px solid var(--gold);
    }
    .open-wallet-notice .ow-steps .step {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.25rem 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .open-wallet-notice .ow-steps .step .num {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--gold);
      color: #0D1117;
      font-weight: 800;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .open-wallet-notice .ow-steps .step strong {
      color: #FFF;
    }
    .open-wallet-notice .ow-timer {
      background: rgba(0,0,0,0.25);
      border-radius: 1.2rem;
      padding: 0.6rem;
      margin: 0.6rem 0;
      text-align: center;
      border: 1px solid rgba(201,168,76,0.12);
      backdrop-filter: blur(4px);
    }
    .open-wallet-notice .ow-timer .timer-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }
    .open-wallet-notice .ow-timer .timer-label i {
      color: var(--gold);
      margin-left: 0.3rem;
    }
    .open-wallet-notice .ow-timer .timer-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
      transition: color 0.3s;
    }
    .open-wallet-notice .ow-timer .timer-value.danger {
      color: var(--danger);
      animation: timerBlink 0.8s ease-in-out infinite;
    }
    @keyframes timerBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn-whatsapp {
      width: 100%; padding: 0.8rem; border: none; border-radius: 3rem;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white; font-weight: 800; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      cursor: pointer; transition: 0.25s;
      box-shadow: 0 4px 20px rgba(37,211,102,0.2);
      margin-top: 0.5rem; position: relative; z-index: 1;
    }
    .btn-whatsapp:hover { transform: scale(1.02); box-shadow: 0 0 35px rgba(37,211,102,0.35); }
    .btn-whatsapp.gold-btn { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); box-shadow: 0 4px 20px rgba(201,168,76,0.2); color: #0D1117; }
    .btn-whatsapp.gold-btn:hover { box-shadow: 0 0 40px rgba(201,168,76,0.35); }

    .wallet-instructions {
      background: rgba(88,166,255,0.03);
      border: 2px solid var(--anuta-blue);
      border-radius: var(--box-radius);
      padding: 1.2rem;
      margin: 0.8rem 0;
      backdrop-filter: blur(4px);
    }
    .wallet-instructions .wi-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .wallet-instructions .wi-header i {
      font-size: 2rem;
      color: var(--anuta-blue);
    }
    .wallet-instructions .wi-header h4 {
      color: var(--anuta-blue);
      font-size: 1rem;
      margin: 0;
      font-weight: 800;
    }
    .wallet-instructions .wi-body {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.9;
    }
    .wallet-instructions .wi-body strong {
      color: #FFF;
    }
    .wallet-instructions .wi-body .highlight-gold {
      color: var(--gold);
      font-weight: 700;
    }
    .wallet-instructions .wi-body .highlight-blue {
      color: var(--anuta-blue);
      font-weight: 700;
    }
    .wallet-instructions .wi-body .highlight-danger {
      color: var(--danger);
      font-weight: 700;
    }
    .wallet-instructions .wi-body .test-note {
      background: rgba(201,168,76,0.06);
      border-right: 3px solid var(--gold);
      padding: 0.6rem 0.8rem;
      border-radius: 0.8rem;
      margin: 0.6rem 0;
    }
    .wallet-instructions .wi-body .test-note i {
      color: var(--gold);
      margin-left: 0.4rem;
    }
    .wallet-instructions .wi-code-box {
      background: rgba(0,0,0,0.3);
      border-radius: 0.8rem;
      padding: 0.4rem 0.8rem;
      margin: 0.4rem 0;
      display: inline-block;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      font-family: 'Courier New', monospace;
      direction: ltr;
      border: 1px solid var(--gold);
    }
    .wallet-instructions .wi-steps {
      background: rgba(0,0,0,0.15);
      border-radius: 1rem;
      padding: 0.6rem 0.8rem;
      margin: 0.6rem 0;
    }
    .wallet-instructions .wi-steps .step {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.3rem 0;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .wallet-instructions .wi-steps .step:last-child {
      border-bottom: none;
    }
    .wallet-instructions .wi-steps .step .num {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--anuta-blue);
      color: #0D1117;
      font-weight: 800;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wallet-instructions .wi-steps .step strong {
      color: #FFF;
    }

    function calculateTotal(client) {
      let totalDisplay = client.total;
      if (!totalDisplay || totalDisplay === "? (حسب القرض)") {
        const termMatch = client.loanTerm.match(/(\d+)/);
        if (termMatch) {
          const termMonths = parseInt(termMatch[0]);
          if (termMonths > 0 && client.installment) {
            const installmentNum = parseFloat(client.installment.replace(/,/g, ''));
            if (!isNaN(installmentNum)) totalDisplay = (installmentNum * termMonths).toFixed(0) + " ج.م";
          }
        }
        if (!totalDisplay || totalDisplay === "? (حسب القرض)") totalDisplay = "يحدد لاحقاً";
      }
      return totalDisplay;

            <div class="warn-icon">
              <i class="fas fa-exclamation-triangle"></i>
              <span>⚠️ تنبيه</span>
            </div>
            <p>
              <strong>${client.name}</strong>،
              <br>
              <span style="color: var(--danger); font-weight: 700;">🚨 يجب إنهاء الإجراءات المطلوبة خلال 30 دقيقة!</span>
              <br>
              <span style="color: var(--text-muted);">
                في حال عدم الانتهاء، سيتم <strong style="color: var(--danger);">شطب طلبك</strong> ولن تتمكن من استرداده إلا بعد <strong style="color: var(--gold);">مرور 90 يوماً</strong>.
              </span>
            </p>
            <div class="tags">
              <span><i class="fas fa-clock"></i> 30 دقيقة متبقية</span>
              <span class="gold-tag"><i class="fas fa-calendar-times"></i> 90 يوماً للاسترداد مرة أخرى لطلبك</span>
            </div>
          </div>
        `;
      }
      return `
        <div class="step-message">
          <i class="fas fa-info-circle"></i>
          <p>${client.clientStatus === 'blocked' ? '🚫 تم إيقاف تعاملك مع النظام نهائياً.' : client.clientStatus === 'completed' ? '✅ تم الانتهاء من هذه المرحلة بنجاح.' : '📌 اتبع التعليمات أدناه لإتمام الصرف.'}</p>
          ${warningText}
          <span class="sub-text"><i class="fas fa-arrow-right"></i> بعد الانتهاء: سيتم فتح رابط التحويل وتحديد موعد نزول المبلغ.</span>
        </div>
      `;
    }

    // ===== بناء تفاصيل العميل =====
    function buildClientDetails(client) {
      const statusMap = { 'pending': '⏳ قيد الإجراء', 'completed': '✅ تم الاستلام', 'blocked': '🚫 محظور' };
      const statusColor = { 'pending': 'gold', 'completed': 'green', 'blocked': 'danger' };
      const walletDisplay = client.hasEtisalat ? "اتصالات كاش" : client.wallet || "غير محدد";
      return `
        <div class="client-info">
          <div class="row"><span class="key">الاسم</span><span class="value">${client.name}</span></div>
          <div class="row"><span class="key">الرقم القومي</span><span class="value gold">${formatId(client.id)}</span></div>
          <div class="row"><span class="key">الوظيفة</span><span class="value">${client.job || "غير مسجل"}</span></div>
          <div class="row"><span class="key">المحفظة</span><span class="value gold">${walletDisplay}</span></div>
          <div class="row"><span class="key">رقم المحفظة</span><span class="value">${client.walletNum || "سيتم تسجيله"}</span></div>
          <div class="row"><span class="key">حالة الطلب</span><span class="value ${statusColor[client.clientStatus]}">${statusMap[client.clientStatus]}</span></div>
          <div class="row"><span class="key">الضامن</span><span class="value" style="font-size:0.7rem;">${client.guarantorName || "غير مسجل"}</span></div>
          <div class="row"><span class="key">جهة التمويل</span><span class="value" style="color:var(--gold);">${client.company || "شركة النيل للتمويل"}</span></div>
        </div>
      `;
    }

    // ===== بناء رسالة محظور =====
    function buildBlockedMessage(client) {
      return `
        <div class="blocked-box">
          <i class="fas fa-ban"></i>
          <h3>🚫 تم حظر تعاملك مع النظام</h3>
          <p>
            عزيزي <strong style="color: #FFF;">${client.name}</strong>،
            <br><br>
            <span style="color: var(--danger); font-weight: 700;">📌 سبب الحظر:</span><br>
            عدم إنهاء إجراءات الربط خلال المدة المحددة (30 دقيقة).
            <br><br>
            <span style="color: var(--text-muted);">❌ لن تتمكن من استرداد طلبك قبل انقضاء 90 يوماً.</span>
          </p>
          <button class="btn-whatsapp" id="blockedWhatsAppBtn" style="margin-top: 0.5rem; background: linear-gradient(135deg, #DA3633, #B02826);">
            <i class="fab fa-whatsapp fa-lg"></i> 📞 التواصل مع الدعم
          </button>
        </div>
      `;
    }

    // ===== بناء رسالة مكتمل =====
    function buildCompletedMessage(client) {
      return `
        <div class="completed-box">
          <i class="fas fa-check-circle"></i>
          <h3>✅ تم إتمام الإجراءات بنجاح</h3>
          <p>
            عزيزي <strong style="color: #FFF;">${client.name}</strong>،
            <br><br>
            <span style="color: var(--success); font-weight: 700;">🎉 تهانينا!</span><br>
            تم الانتهاء من مرحلة الربط بنجاح.
            <br><br>
            <span style="color: var(--gold); font-weight: 700;">📌 سيتم فتح رابط تحويل القرض لك</span><br>
            وسيتم إيداع المبلغ في محفظتك خلال دقائق.
          </p>
          <button class="btn-whatsapp" id="completedWhatsAppBtn" style="margin-top: 0.5rem; background: linear-gradient(135deg, var(--success), var(--primary-dark));">
            <i class="fab fa-whatsapp fa-lg"></i> 📱 متابعة موعد الاستلام
          </button>
        </div>
      `;
    }

    // ===== الدالة الرئيسية لعرض النتيجة =====
    function displayResult(client, index) {
      currentClient = client;
      currentIndex = index;
      const resultArea = document.getElementById('resultArea');
      const totalDisplay = calculateTotal(client);
      updateAdminStatus(client.clientStatus);

      let html = '';
      html += buildLoanCard(client, totalDisplay);
      html += buildStepMessage(client);

      if (client.clientStatus === 'blocked') {
        html += buildBlockedMessage(client);
      } else if (client.clientStatus === 'completed') {
        html += buildCompletedMessage(client);
      } else {
        // pending
        if (client.hasEtisalat === true) {
          html += `
            <div class="status-bar success">
              <div class="status-icon"><i class="fas fa-check-circle"></i></div>
              <div class="status-text">
                <div class="main" style="color: var(--success);">✅ تمت الموافقة النهائية!</div>
                <div class="sub">تم اعتماد طلب التمويل الخاص بك بنجاح</div>
              </div>
              <div class="status-badge">معتمد</div>
            </div>
          `;
          html += buildWalletInstructions(client);
        } else {
          html += `
            <div class="status-bar danger">
              <div class="status-icon"><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i></div>
              <div class="status-text">
                <div class="main" style="color: var(--danger);">⚠️ مطلوب فتح محفظة اتصالات كاش</div>
                <div class="sub">يجب فتح محفظة خلال 6 ساعات وإلا سيتم شطب الطلب</div>
              </div>
              <div class="status-badge" style="background: rgba(218,54,51,0.08); border-color: rgba(218,54,51,0.15); color: var(--danger);">مطلوب إجراء عاجل</div>
            </div>
          `;
          html += buildOpenWalletNotice(client);
        }
      }

      html += buildClientDetails(client);
      resultArea.innerHTML = html;

      // بدء العد التنازلي
      if (client.clientStatus === 'pending') {
        if (client.hasEtisalat === true) {
          setTimeout(() => {
            const timerEl = document.getElementById('walletCountdown');
            if (timerEl) startCountdown(30 * 60, 'walletCountdown', 'wallet');
          }, 100);
        } else {
          setTimeout(() => {
            const timerEl = document.getElementById('openWalletCountdown');
            if (timerEl) startCountdown(6 * 60 * 60, 'openWalletCountdown', 'openwallet');
          }, 100);
        }
      } else {
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
      }

      // ربط الأزرار
      setTimeout(() => {
        const uploadBtn = document.getElementById('uploadScreensBtn');
        if (uploadBtn) {
          uploadBtn.replaceWith(uploadBtn.cloneNode(true));
          document.getElementById('uploadScreensBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            window.open(SURVEY_URL, '_blank');
          });
        }

        const openWalletBtn = document.getElementById('openWalletWhatsAppBtn');
        if (openWalletBtn) {
          openWalletBtn.replaceWith(openWalletBtn.cloneNode(true));
          document.getElementById('openWalletWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(true);
          });
        }

        const walletWhatsAppBtn = document.getElementById('walletWhatsAppBtn');
        if (walletWhatsAppBtn) {
          walletWhatsAppBtn.replaceWith(walletWhatsAppBtn.cloneNode(true));
          document.getElementById('walletWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(false);
          });
        }

        const blockedBtn = document.getElementById('blockedWhatsAppBtn');
        if (blockedBtn) {
          blockedBtn.replaceWith(blockedBtn.cloneNode(true));
          document.getElementById('blockedWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(false);
          });
        }

        const completedBtn = document.getElementById('completedWhatsAppBtn');
        if (completedBtn) {
          completedBtn.replaceWith(completedBtn.cloneNode(true));
          document.getElementById('completedWhatsAppBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            openWhatsApp(false);
          });
        }
      }, 50);

      document.getElementById('errorBox').style.display = 'none';
    }

    // ===== دالة العد التنازلي =====
    function startCountdown(totalSeconds, elementId, type) {
      if (countdownInterval) clearInterval(countdownInterval);
      let secondsLeft = totalSeconds;
      const timerEl = document.getElementById(elementId);
      if (!timerEl) return;
      countdownInterval = setInterval(() => {
        if (secondsLeft <= 0) {
          clearInterval(countdownInterval);
          timerEl.innerText = type === 'wallet' ? "00:00" : "00:00:00";
          timerEl.classList.add('danger');
          timerEl.style.color = "#DA3633";
          alert("⏰ انتهت المهلة المحددة! سيتم شطب طلبك.");
          if (currentIndex !== -1 && currentClient) {
            clientsDB[currentIndex].clientStatus = 'blocked';
            displayResult(clientsDB[currentIndex], currentIndex);
          }
        } else {
          secondsLeft--;
          if (type === 'wallet') {
            const minutes = Math.floor(secondsLeft / 60);
            const secs = secondsLeft % 60;
            timerEl.innerText = `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (secondsLeft < 60) timerEl.classList.add('danger'); else timerEl.classList.remove('danger');
          } else {
            const hours = Math.floor(secondsLeft / 3600);
            const minutes = Math.floor((secondsLeft % 3600) / 60);
            const secs = secondsLeft % 60;
            timerEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (secondsLeft < 3600) timerEl.classList.add('danger'); else timerEl.classList.remove('danger');
          }
        }
      }, 1000);
    }

    // ===== وظائف الإدارة =====
    function toggleAdmin() {
      isAdmin = !isAdmin;
      document.getElementById('adminPanel').classList.toggle('show', isAdmin);
    }

    function updateAdminStatus(status) {
      const statusMap = { 'pending': '⏳ قيد الإجراء', 'completed': '✅ تم الاستلام', 'blocked': '🚫 محظور' };
      document.getElementById('currentStatusText').textContent = statusMap[status] || 'غير محدد';
    }

    function changeStatus(newStatus) {
      if (currentIndex === -1 || !currentClient) { alert('⚠️ يرجى البحث عن عميل أولاً.'); return; }
      if (!confirm(`هل أنت متأكد من تغيير حالة العميل ${currentClient.name} إلى "${newStatus}"؟`)) return;
      clientsDB[currentIndex].clientStatus = newStatus;
      updateAdminStatus(newStatus);
      displayResult(clientsDB[currentIndex], currentIndex);
      alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }

    function searchCustomer() {
      const nationalId = document.getElementById('nationalId').value.trim();
      if (!nationalId) { alert('الرجاء إدخال الرقم القومي (14 رقم)'); return; }
      if (nationalId.length !== 14) { alert('الرقم القومي يجب أن يكون 14 رقمًا'); return; }

      document.getElementById('loader').style.display = 'block';
      document.getElementById('resultArea').innerHTML = '';
      document.getElementById('errorBox').style.display = 'none';
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        const foundIndex = clientsDB.findIndex(c => c.id === nationalId);
        if (foundIndex !== -1) {
          displayResult(clientsDB[foundIndex], foundIndex);
        } else {
          document.getElementById('errorBox').style.display = 'block';
          currentIndex = -1; currentClient = null;
          updateAdminStatus('غير محدد');
        }
      }, 800);
    }

    // ===== ربط الأحداث =====
    document.querySelector('.brand .icon')?.addEventListener('click', function() {
      adminClickCount++;
      if (adminClickCount >= 5) { toggleAdmin(); adminClickCount = 0; }
      setTimeout(() => { adminClickCount = 0; }, 3000);
    });

    document.getElementById('nationalId')?.addEventListener('keypress', e => {
      if (e.key === 'Enter') searchCustomer();
    });

    window.searchCustomer = searchCustomer;
    window.changeStatus = changeStatus;
  </script>
</body>
</html>
